# Send the resolved Gradle dependency graph to GitHub, so Dependabot alerts can
# see transitive dependencies.
name: Dependency Submission

on:
  push:
    branches: [main]

permissions: {}

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the dependency submission API requires it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Submit only what ships: the app's release runtime classpath and the core module's
          # runtime classpath. The filter is a full-match, case-sensitive regular expression on
          # the configuration where a dependency is resolved, so it excludes debug, test,
          # androidTest, lint, annotation processor, compiler plugin, and buildscript classpaths.
          # Those carry build tooling that is not shipped, and Dependabot would raise alerts on it.
          dependency-graph-include-configurations: releaseRuntimeClasspath|runtimeClasspath
