name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  sonarqube:
    # Dependabot runs don't receive Actions secrets, so SONAR_TOKEN is empty and
    # the scan can't authenticate; skip — dependency bumps carry no analyzable code.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarQube needs history to attribute new code
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Measure coverage and analyze
        run: ./gradlew :koverXmlReport sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
