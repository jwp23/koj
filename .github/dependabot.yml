# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    # CI checks pull request titles against the Conventional Commits convention.
    # Dependabot otherwise infers the style from recent history, which is
    # implicit and can drift; state it instead.
    commit-message:
      prefix: "chore"
      include: "scope"
    # Wait before proposing a new release, so a compromised one has time to be
    # noticed and withdrawn.
    cooldown:
      default-days: 7
    # Batch non-major updates into a single PR; majors stay separate for review.
    groups:
      gradle:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 7
    # Batch non-major updates into a single PR; majors stay separate for review.
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
